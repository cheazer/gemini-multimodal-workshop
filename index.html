<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snap & Ask · Gemini workshop</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Snap &amp; Ask</h1>
        <p class="sub">Upload a picture, ask Gemini anything about it.</p>
        <span id="mode" class="mode">starter</span>
      </header>

      <section class="card">
        <label class="drop" id="drop">
          <input type="file" id="file" accept="image/*" hidden />
          <img id="preview" alt="" hidden />
          <span id="dropText">Click or drop an image here (optional)</span>
        </label>

        <textarea id="prompt" rows="3" placeholder="What's in this picture?"></textarea>

        <div class="buttons">
          <button id="askBtn">Ask Gemini</button>
          <button id="jsonBtn" class="secondary">Get structured JSON</button>
        </div>
      </section>

      <section class="card">
        <h2>Answer</h2>
        <pre id="output">Nothing yet.</pre>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
