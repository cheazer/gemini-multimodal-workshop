<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snap & Ask · Gemini multimodal app</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Snap &amp; Ask</h1>
        <p class="sub">Show Gemini a picture, ask it anything.</p>
      </header>

      <section class="card">
        <div class="row">
          <label for="keyInput" class="label">Gemini API key</label>
          <span id="keyStatus" class="status"></span>
        </div>
        <div class="inline">
          <input id="keyInput" type="password" placeholder="Paste your key from aistudio.google.com/apikey" autocomplete="off" />
          <button id="keySave" class="secondary">Save</button>
        </div>
        <p class="hint">Saved only in this browser. Don't share it or put it in your code.</p>
      </section>

      <section class="card">
        <div class="grid2">
          <div>
            <label for="preset" class="label">App</label>
            <select id="preset"></select>
          </div>
          <div>
            <label for="model" class="label">Model</label>
            <select id="model">
              <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
              <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (faster, use if rate limited)</option>
            </select>
          </div>
        </div>

        <label for="system" class="label">System instruction (its personality and rules)</label>
        <textarea id="system" rows="2"></textarea>
      </section>

      <section class="card">
        <label class="drop" id="drop">
          <input type="file" id="file" accept="image/*,.heic,.heif" hidden />
          <img id="preview" alt="Your chosen image" hidden />
          <span id="dropText">Click, drop, or paste an image here (optional)</span>
        </label>
        <button id="clearImg" class="link" hidden>Remove image</button>

        <label for="prompt" class="label">Your question</label>
        <textarea id="prompt" rows="2"></textarea>

        <div class="buttons">
          <button id="askBtn">Ask Gemini</button>
          <button id="jsonBtn" class="secondary">Get structured JSON</button>
        </div>
      </section>

      <section class="card">
        <h2>Answer</h2>
        <pre id="output">Nothing yet.</pre>
      </section>

      <footer>Built at GDG on Campus University of Aberdeen · Gemini API + Google Gen AI SDK</footer>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
